<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>SDR Plane tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            height: 100%;
            width: 100%;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 100%;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 1002;
            transition: left 0.3s ease;
        }

        .map-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .header {
            padding: 15px;
            background: #1a252f;
        }

        .header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .mode-toggle {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .panel {
            padding: 15px;
            border-bottom: 1px solid #34495e;
        }

        .flight-list {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .flight-item {
            background: #34495e;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .flight-item.selected {
            border-color: #1abc9c;
        }

        button,
        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        /* Custom Plane Icon */
        .plane-icon {
            background: none;
            border: none;
        }

        .plane-svg {
            width: 30px;
            height: 30px;
            fill: #f1c40f;
            filter: drop-shadow(0px 0px 1px #fff);
            transition: fill 0.2s ease;
            /* Gladka sprememba barve */
        }

        .plane-svg.history {
            fill: #3498db;
        }

        /* POPRAVEK: Barva za izbrano letalo (temno oranžna) */
        .plane-svg.selected-plane {
            fill: #d35400 !important;
            /* Temno oranžna (Pumpkin) */
            filter: drop-shadow(0px 0px 3px #fff);
            /* Malo močnejši sij, da izstopa */
        }

        #history-panel {
            display: none;
        }

        /* Styles for sidebar toggle */
        .sidebar-toggle-button {
            position: absolute;
            left: 300px;
            bottom: 10px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 1003;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: left 0.3s ease;
            width: auto;
        }

        .container.sidebar-hidden .sidebar {
            left: -300px;
        }

        .container.sidebar-hidden .sidebar-toggle-button {
            left: 0;
        }

        /* Okno s podatki v desnem spodnjem kotu */
        .telemetry-card {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 280px;
            background: rgba(44, 62, 80, 0.95);
            color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            display: none;
            /* Skrito po defaultu, dokler ne kliknemo letala */
            border-left: 4px solid #d35400;
            /* Oranžna črta, ki se ujema z izbranim letalom */
            font-size: 0.9rem;
        }

        .telemetry-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #f1c40f;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
        }

        .telemetry-card .close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 1rem;
            width: auto;
            padding: 0;
            margin: 0;
        }

        .telemetry-card .close-btn:hover {
            color: white;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .telemetry-label {
            color: #bdc3c7;
        }

        .telemetry-value {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h2>SDR Plane Tracker</h2>
                <div class="mode-toggle">
                    <label><input type="radio" name="mode" value="live" checked onchange="toggleMode()"> V živo</label>
                    <label><input type="radio" name="mode" value="history" onchange="toggleMode()"> Zgodovina
                        (Replay)</label>
                </div>
            </div>

            <div id="live-panel" class="panel">
                <h4>Status</h4>
                <div id="live-count">Zaznanih letal: 0</div>
            </div>

            <div id="history-panel" class="panel">
                <h4>Zgodovina</h4>
                <input type="datetime-local" id="hist-date">
                <input type="time" id="hist-time" step="2">
                <button onclick="fetchHistory()">Prikaži</button>
                <div style="margin-top: 10px">
                    <label><input type="checkbox" id="auto-play" onchange="toggleAutoPlay()"> Avtomatsko (2s)</label>
                </div>
                <div id="hist-count" style="margin-top: 10px;">Zaznanih letal: 0</div>
            </div>

            <div class="flight-list" id="flight-list">
                <!-- Flight items will go here -->
            </div>
        </div>
        <button class="sidebar-toggle-button" onclick="toggleSidebar()">❮</button>
        <div class="map-section">
            <div id="map"></div>
        </div>
        <div id="telemetry-card" class="telemetry-card">
            <button class="close-btn" onclick="closeTelemetry()">✕</button>
            <h3 id="tel-flight">Let: N/A</h3>
            <div class="telemetry-row"><span class="telemetry-label">Hex koda:</span><span class="telemetry-value"
                    id="tel-hex">-</span></div>
            <div class="telemetry-row"><span class="telemetry-label">Višina (Alt):</span><span class="telemetry-value"
                    id="tel-alt">-</span></div>
            <div class="telemetry-row"><span class="telemetry-label">Hitrost (GS):</span><span class="telemetry-value"
                    id="tel-gs">-</span></div>
            <div class="telemetry-row"><span class="telemetry-label">Smer (Track):</span><span class="telemetry-value"
                    id="tel-track">-</span></div>
            <div class="telemetry-row"><span class="telemetry-label">Pozicija:</span><span class="telemetry-value"
                    id="tel-pos">-</span></div>
            <div class="telemetry-row" style="margin-top: 8px; border-top: 1px dashed #34495e; padding-top: 5px;">
                <span class="telemetry-label">Dolžina sledenja:</span><span class="telemetry-value" id="tel-distance"
                    style="color: #1abc9c;">0.0 km</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([46.0, 14.5], 8);

        map.on('click', function (e) {
            // Če kliknemo na prazno mesto na zemljevidu, počistimo izbiro
            if (selectedFlightHex !== null) {
                selectedFlightHex = null;
                redrawAllPaths();
                updateSelectionHighlight();
                document.getElementById('telemetry-card').style.display = 'none'; // Skrij kartico
            }
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        let markers = {};
        let polylines = {};
        let selectedFlightHex = null;

        let mode = 'live';
        let liveInterval = null;
        let historyInterval = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Polmer Zemlje v km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getTrackLength(segments) {
            if (!segments || segments.length === 0) return 0;
            let totalDist = 0;
            segments.forEach(segment => {
                for (let i = 1; i < segment.length; i++) {
                    totalDist += calculateDistance(segment[i - 1][0], segment[i - 1][1], segment[i][0], segment[i][1]);
                }
            });
            return totalDist;
        }

        function closeTelemetry() {
            document.getElementById('telemetry-card').style.display = 'none';
            if (selectedFlightHex !== null) {
                selectedFlightHex = null;
                redrawAllPaths();
                updateSelectionHighlight();
            }
        }

        const planeSvg = `<svg viewBox="0 0 24 24" class="plane-svg {CLASS}"><path d="M21,16V14L13,9V3.5A1.5,1.5 0 0,0 11.5,2 A1.5,1.5 0 0,0 10,3.5V9L2,14V16L10,13.5V19L8,20.5V22L11.5,21L15,22V20.5L13,19V13.5L21,16Z"/></svg>`;

        function getPlaneIcon(track, isHistory, isSelected) {
            // Sestavimo razrede: če je izbran, dodamo 'selected-plane', če je zgodovina, dodamo 'history'
            let classes = [];
            if (isHistory) classes.push('history');
            if (isSelected) classes.push('selected-plane');

            return L.divIcon({
                html: `<div style="transform: rotate(${track}deg); transform-origin: center;">` +
                    planeSvg.replace('{CLASS}', classes.join(' ')) + `</div>`,
                className: 'plane-icon',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function updateMap(data, isHistory = false) {
            if (!data || !data.aircraft || !data.all_aircraft) {
                console.error("Invalid data received:", data);
                return;
            }

            // Remove missing markers from map
            let currentActiveHexes = new Set(data.aircraft.map(p => p.hex));
            for (let hex in markers) {
                if (!currentActiveHexes.has(hex)) {
                    map.removeLayer(markers[hex]);
                    if (polylines[hex]) {
                        polylines[hex].forEach(pl => map.removeLayer(pl));
                        delete polylines[hex];
                    }
                    delete markers[hex];
                }
            }

            // // Update Full List in sidebar
            // const listDiv = document.getElementById('flight-list');
            // listDiv.innerHTML = '';

            // let visibleAircraft = [];

            // for (let hex in markers) {
            //     // Poiščemo najnovejše podatke za ta hex v vseh prejetih letalih (tudi če so za sekundo izginila iz 'aircraft')
            //     let p = data.aircraft.find(a => a.hex === hex) || data.all_aircraft.find(a => a.hex === hex);

            //     if (p) {
            //         visibleAircraft.push(p);
            //     } else {
            //         // Če podatkov sploh ni več v 24-urni zgodovini, uporabimo osnovni hex
            //         visibleAircraft.push({ hex: hex, flight: hex, alt_baro: 'N/A', gs: 'N/A' });
            //     }
            // }

            // visibleAircraft.sort((a, b) => {
            //     let nameA = (a.flight || a.hex).toString().trim();
            //     let nameB = (b.flight || b.hex).toString().trim();
            //     return nameA.localeCompare(nameB);
            // });

            // visibleAircraft.forEach(p => {
            //     let item = document.createElement('div');
            //     item.className = 'flight-item';
            //     item.id = `flight-item-${p.hex}`;
            //     item.innerHTML = `<b>${p.flight || p.hex}</b><br>Alt: ${p.alt_baro || 'N/A'} ft<br>GS: ${p.gs || 'N/A'}`;
            //     item.onclick = () => toggleFlightSelection(p.hex);
            //     listDiv.appendChild(item);
            // });


            // Update active aircraft on map
            data.aircraft.forEach(p => {
                let track = p.track || 0;
                let isSelected = (p.hex === selectedFlightHex);

                let displayName = (p.flight && p.flight.trim() !== "") ? p.flight : p.hex;

                // Add/update marker
                if (!markers[p.hex]) {
                    markers[p.hex] = L.marker([p.lat, p.lon], { icon: getPlaneIcon(track, isHistory, isSelected) }).addTo(map)
                        .bindPopup(`<b>${displayName}</b>`, { autoPan: false });

                    markers[p.hex].on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        toggleFlightSelection(p.hex);
                    });
                } else {
                    markers[p.hex].setLatLng([p.lat, p.lon]);
                    markers[p.hex].setIcon(getPlaneIcon(track, isHistory, isSelected));
                    let popup = markers[p.hex].getPopup();
                    if (popup) {
                        popup.options.autoPan = false;
                    }
                    markers[p.hex].setPopupContent(`<b>${displayName}</b>`);
                }

                // Update paths based on selection
                updateFlightPath(p, data.paths, isHistory);
            });

            // Update Full List in sidebar
            const listDiv = document.getElementById('flight-list');
            listDiv.innerHTML = '';

            let visibleAircraft = [];
            for (let hex in markers) {
                let p = data.aircraft.find(a => a.hex === hex) || data.all_aircraft.find(a => a.hex === hex);
                if (p) {
                    visibleAircraft.push(p);
                } else {
                    visibleAircraft.push({ hex: hex, flight: hex, alt_baro: 'N/A', gs: 'N/A' });
                }
            }

            // Sortiramo po prikažnem imenu (Flight number oz. Hex)
            visibleAircraft.sort((a, b) => {
                let nameA = ((a.flight && a.flight.trim() !== "") ? a.flight : a.hex).toString().trim();
                let nameB = ((b.flight && b.flight.trim() !== "") ? b.flight : b.hex).toString().trim();
                return nameA.localeCompare(nameB);
            });

            // Izris v stransko vrstico
            visibleAircraft.forEach(p => {
                let displayName = (p.flight && p.flight.trim() !== "") ? p.flight : p.hex;
                let item = document.createElement('div');
                item.className = 'flight-item';
                item.id = `flight-item-${p.hex}`; // ID elementa še vedno sledljiv preko hex-a
                item.innerHTML = `<b>${displayName}</b><br>Alt: ${p.alt_baro || 'N/A'} ft<br>GS: ${p.gs || 'N/A'}`;
                item.onclick = () => toggleFlightSelection(p.hex); // Klik vedno preda hex
                listDiv.appendChild(item);
            });

            if (selectedFlightHex) {
                updateTelemetryCard(data);
            }

            updateSelectionHighlight();

            if (isHistory) {
                document.getElementById('hist-count').innerText = `Zaznanih letal: ${data.aircraft.length}`;
            } else {
                document.getElementById('live-count').innerText = `Zaznanih letal: ${data.aircraft.length}`;
            }
        }

        function updateFlightPath(p, pathsData, isHistory) {
            if (!pathsData) return;

            // POTI: Sedaj so na backendu poenotene in vedno shranjene pod hex kodo!
            let flightSegments = pathsData[p.hex];

            if (p.hex !== selectedFlightHex) {
                if (polylines[p.hex]) {
                    polylines[p.hex].forEach(pl => map.removeLayer(pl));
                    polylines[p.hex] = [];
                }
                return;
            }

            if (flightSegments && flightSegments.length > 0) {
                if (!polylines[p.hex]) polylines[p.hex] = [];

                polylines[p.hex].forEach(pl => map.removeLayer(pl));
                polylines[p.hex] = [];

                flightSegments.forEach(segment => {
                    if (segment.length < 2) return;
                    let color = isHistory ? '#3498db' : '#d35400';
                    let pl = L.polyline(segment, { color: color, weight: 3, opacity: 0.8 }).addTo(map);
                    polylines[p.hex].push(pl);
                });
            }
        }

        function updateTelemetryCard(data) {
            if (!selectedFlightHex || !data) return;

            let p = data.aircraft.find(a => a.hex === selectedFlightHex) || data.all_aircraft.find(a => a.hex === selectedFlightHex);
            if (!p) return;

            const card = document.getElementById('telemetry-card');

            // POENOTENJE: Če obstaja flight številka, izpiši npr. "Let: FR123", drugače "Let: 4b12a2"
            let displayName = (p.flight && p.flight.trim() !== "") ? p.flight : p.hex;

            document.getElementById('tel-flight').innerText = `Let: ${displayName}`;
            document.getElementById('tel-hex').innerText = p.hex;
            document.getElementById('tel-alt').innerText = p.alt_baro ? `${p.alt_baro} ft` : 'N/A';
            document.getElementById('tel-gs').innerText = p.gs ? `${p.gs} kt` : 'N/A';
            document.getElementById('tel-track').innerText = p.track ? `${p.track}°` : 'N/A';
            document.getElementById('tel-pos').innerText = `${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`;

            let flightSegments = data.paths ? data.paths[p.hex] : null;
            if (flightSegments) {
                let totalKm = getTrackLength(flightSegments);
                document.getElementById('tel-distance').innerText = `${totalKm.toFixed(1)} km`;
            } else {
                document.getElementById('tel-distance').innerText = '0.0 km';
            }

            card.style.display = 'block';
        }

        function toggleFlightSelection(hex) {
            if (selectedFlightHex === hex) {
                selectedFlightHex = null; // Deselect, če kliknemo isto letalo
                document.getElementById('telemetry-card').style.display = 'none'; // Skrij kartico
            } else {
                selectedFlightHex = hex;
            }

            // Takoj osvežimo poti in sidebar, da ni zamika do naslednjega fetch-a
            redrawAllPaths();
            updateSelectionHighlight();

            if (selectedFlightHex && lastData) {
                updateTelemetryCard(lastData);
            }
        }

        function updateSelectionHighlight() {
            document.querySelectorAll('.flight-item').forEach(item => {
                item.classList.remove('selected');
            });
            if (selectedFlightHex) {
                const selectedItem = document.getElementById(`flight-item-${selectedFlightHex}`);
                if (selectedItem) {
                    selectedItem.classList.add('selected');
                }
            }
        }

        let lastData = null; // Store last fetched data
        function redrawAllPaths() {
            if (!lastData) return;
            // Clear all polylines
            for (const hex in polylines) {
                polylines[hex].forEach(pl => map.removeLayer(pl));
                polylines[hex] = [];
            }
            // Redraw paths for all planes based on current selection
            lastData.aircraft.forEach(p => {
                updateFlightPath(p, lastData.paths, mode === 'history');

                // POPRAVEK: Ko ročno rišemo poti ob kliku, takoj posodobimo tudi barvo markerja na zemljevidu
                if (markers[p.hex]) {
                    let track = p.track || 0;
                    let isSelected = (p.hex === selectedFlightHex);
                    markers[p.hex].setIcon(getPlaneIcon(track, mode === 'history', isSelected));
                }
            });
        }

        async function fetchLive() {
            if (mode !== 'live') return;
            try {
                let res = await fetch('/live/collated');
                lastData = await res.json();
                updateMap(lastData, false);
            } catch (e) { }
        }

        async function fetchHistory() {
            if (mode !== 'history') return;
            let date = document.getElementById('hist-date').value;
            let time = document.getElementById('hist-time').value;
            if (!date || !time) return;

            let dt = `${date}T${time}`;
            try {
                let res = await fetch(`/live/history/data?target_time=${dt}`);
                lastData = await res.json();
                updateMap(lastData, true);
            } catch (e) { }
        }

        async function toggleMode() {
            mode = document.querySelector('input[name="mode"]:checked').value;
            if (mode === 'live') {
                document.getElementById('live-panel').style.display = 'block';
                document.getElementById('history-panel').style.display = 'none';
                clearInterval(historyInterval);
                historyInterval = null;
                fetchLive();
                liveInterval = setInterval(fetchLive, 2000);
            } else {
                document.getElementById('live-panel').style.display = 'none';
                document.getElementById('history-panel').style.display = 'block';
                clearInterval(liveInterval);
                liveInterval = null;
                lastData = null;
                selectedFlightHex = null;

                try {
                    let r = await fetch('/live/history/dates');
                    let d = await r.json();
                    if (d.max) {
                        let dtx = new Date(d.max);
                        let year = dtx.getFullYear();
                        let month = String(dtx.getMonth() + 1).padStart(2, '0');
                        let day = String(dtx.getDate()).padStart(2, '0');
                        let hours = String(dtx.getHours()).padStart(2, '0');
                        let minutes = String(dtx.getMinutes()).padStart(2, '0');
                        let seconds = String(dtx.getSeconds()).padStart(2, '0');

                        // Pravilen vnos v ločena polja brez sesutja brskalnika
                        document.getElementById('hist-date').value = `${year}-${month}-${day}`;
                        document.getElementById('hist-time').value = `${hours}:${minutes}:${seconds}`;
                    }
                } catch (err) {
                    console.error("Napaka pri datumi zgodovine:", err);
                }
                fetchHistory();
            }
        }

        function stepHistory() {
            let dateInput = document.getElementById('hist-date');
            let timeInput = document.getElementById('hist-time');
            if (!dateInput.value || !timeInput.value) return;

            // Ustvarimo objekt datuma iz trenutno nastavljenih vrednosti
            let currentDt = new Date(`${dateInput.value}T${timeInput.value}`);
            // Prištejemo natanko 2 sekundi za naslednji korak predvajanja
            currentDt.setSeconds(currentDt.getSeconds() + 2);

            let year = currentDt.getFullYear();
            let month = String(currentDt.getMonth() + 1).padStart(2, '0');
            let day = String(currentDt.getDate()).padStart(2, '0');
            let hours = String(currentDt.getHours()).padStart(2, '0');
            let minutes = String(currentDt.getMinutes()).padStart(2, '0');
            let seconds = String(currentDt.getSeconds()).padStart(2, '0');

            dateInput.value = `${year}-${month}-${day}`;
            timeInput.value = `${hours}:${minutes}:${seconds}`;

            fetchHistory();
        }

        function toggleAutoPlay() {
            let auto = document.getElementById('auto-play').checked;
            if (auto) {
                historyInterval = setInterval(stepHistory, 2000);
            } else {
                clearInterval(historyInterval);
                historyInterval = null;
            }
        }

        function toggleSidebar() {
            const container = document.querySelector('.container');
            container.classList.toggle('sidebar-hidden');
            const button = document.querySelector('.sidebar-toggle-button');
            if (container.classList.contains('sidebar-hidden')) {
                button.innerHTML = '❯';
            } else {
                button.innerHTML = '❮';
            }
        }

        // Init
        toggleMode();
    </script>
</body>

</html>
